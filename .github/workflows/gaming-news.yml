name: Publish gaming news with API
run-name: Gaming news API fallback

"on":
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-gaming-news-api
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check API credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is missing. The normal publisher now runs locally through Codex."
            exit 1
          fi

      - name: Test and generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
        run: |
          node --test scripts/gaming-news.test.mjs
          node scripts/install-gaming-news.mjs
          node scripts/gaming-news.mjs
          node scripts/validate-gaming-news.mjs

      - name: Commit the published edition
        shell: bash
        run: |
          if git diff --quiet -- index.html news/data; then
            echo "No publication changes."
            exit 0
          fi
          git config user.name "SarcasticSir"
          git config user.email "167876826+SarcasticSir@users.noreply.github.com"
          git add index.html news/data
          git commit -m "Publish rewritten gaming news [skip ci]"
          git push
