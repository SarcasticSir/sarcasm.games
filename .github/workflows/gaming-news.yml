name: Publish daily gaming news
run-name: Gaming news · ${{ github.event_name }}

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gaming-news.yml'
      - 'scripts/gaming-news.mjs'
      - 'scripts/install-gaming-news.mjs'
      - 'scripts/validate-gaming-news.mjs'
  schedule:
    - cron: '17 6 * * *'
      timezone: 'Europe/Oslo'
    - cron: '47 */2 * * *'
      timezone: 'Europe/Oslo'

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-gaming-news
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Determine whether publication is needed
        id: freshness
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const parts = new Intl.DateTimeFormat('en-CA', {
            timeZone: 'Europe/Oslo', year: 'numeric', month: '2-digit', day: '2-digit'
          }).formatToParts(new Date());
          const get = (type) => parts.find((part) => part.type === type)?.value;
          const today = `${get('year')}-${get('month')}-${get('day')}`;
          let publishedDate = '';
          try {
            publishedDate = JSON.parse(fs.readFileSync('news/data/automation.json', 'utf8')).date || '';
          } catch {}
          const needed = publishedDate !== today;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `needed=${needed}\n`);
          console.log(needed ? `Publication is needed for ${today}.` : `A validated automatic edition already exists for ${today}.`);
          NODE

      - name: Run news unit tests
        if: steps.freshness.outputs.needed == 'true'
        run: node --test scripts/gaming-news.test.mjs

      - name: Add the bilingual homepage menu entry
        if: steps.freshness.outputs.needed == 'true'
        run: node scripts/install-gaming-news.mjs

      - name: Check AI credential
        if: steps.freshness.outputs.needed == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is missing. Add it under Settings → Secrets and variables → Actions → Repository secrets."
            exit 1
          fi

      - name: Collect and rewrite today's gaming news
        if: steps.freshness.outputs.needed == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
        run: node scripts/gaming-news.mjs

      - name: Validate generated data
        if: steps.freshness.outputs.needed == 'true'
        run: node scripts/validate-gaming-news.mjs

      - name: Mark automatic publication complete
        if: steps.freshness.outputs.needed == 'true'
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const edition = JSON.parse(fs.readFileSync('news/data/latest.json', 'utf8'));
          fs.writeFileSync('news/data/automation.json', JSON.stringify({
            date: edition.date,
            generatedAt: edition.generatedAt,
            workflowRun: process.env.GITHUB_RUN_ID,
            provider: 'openai'
          }, null, 2) + '\n');
          NODE

      - name: Commit the published edition
        if: steps.freshness.outputs.needed == 'true'
        shell: bash
        run: |
          if git diff --quiet -- index.html news/data; then
            echo "No publication changes."
            exit 0
          fi
          git config user.name "SarcasticSir"
          git config user.email "167876826+SarcasticSir@users.noreply.github.com"
          git add index.html news/data
          git commit -m "Publish rewritten gaming news [skip ci]"
          git push

      - name: Close resolved failure report
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Automated gaming news publication failed';
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            for (const issue of data.filter((item) => item.title === title && !item.pull_request)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Resolved automatically by successful run ${context.runId}.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
            }

      - name: Report publication failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Automated gaming news publication failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The fully automatic gaming-news workflow stopped.',
              '',
              `- Run: ${runUrl}`,
              `- Commit: ${context.sha}`,
              `- Trigger: ${context.eventName}`,
              `- Time: ${new Date().toISOString()}`,
              '',
              'The previous valid edition remains published. The workflow retries automatically every two hours until a valid edition is published.',
              '',
              'Human input is required only when the failure concerns the OPENAI_API_KEY repository secret, API billing/limits, repository permissions, or another unavailable required service.'
            ].join('\n');
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = data.find((item) => item.title === title && !item.pull_request);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
