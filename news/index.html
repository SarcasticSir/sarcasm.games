<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Daglig omskrevne gamingnyheter fra utvalgte kilder." />
  <title>Gamingnytt – sarcasm.games</title>
  <style>
    :root{color-scheme:dark;--bg:#090b12;--card:#141925;--card2:#1a2130;--text:#f3f5fa;--muted:#9da8ba;--line:#293249;--accent:#6ee7b7;--blue:#60a5fa;--warn:#fbbf24;--shadow:0 20px 55px rgba(0,0,0,.25)}
    body.light{color-scheme:light;--bg:#f4f6fb;--card:#fff;--card2:#f1f4f9;--text:#141823;--muted:#5d6879;--line:#dce2eb;--accent:#087f5b;--blue:#1d4ed8;--warn:#946200;--shadow:0 16px 45px rgba(31,41,55,.09)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}a{color:inherit}.shell{width:min(1080px,100%);margin:auto;padding:18px 18px 64px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:44px}.brand{text-decoration:none;font-weight:800}.controls{display:flex;gap:8px}.control{border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 11px;border-radius:9px;cursor:pointer}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:18px}h1{font-size:clamp(2.6rem,7vw,5rem);letter-spacing:-.055em;line-height:.95;margin:0}.date{color:var(--muted);white-space:nowrap}.filters{display:flex;gap:8px;overflow-x:auto;padding:4px 0 18px;scrollbar-width:thin}.filter{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--muted);padding:7px 11px;border-radius:999px;font:inherit;font-size:.84rem;font-weight:700;cursor:pointer}.filter:hover{border-color:var(--blue);color:var(--text)}.filter.active{border-color:var(--accent);background:var(--card2);color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}.story{grid-column:span 6;display:flex;flex-direction:column;background:linear-gradient(155deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:17px;padding:21px;box-shadow:var(--shadow)}.story:first-child{grid-column:span 12}.meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.category{font-size:.76rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--blue)}.status{font-size:.72rem;font-weight:800;border:1px solid var(--line);border-radius:999px;padding:4px 7px}.status.rumor{color:var(--warn)}.status.confirmed{color:var(--accent)}h2{font-size:clamp(1.2rem,2.4vw,1.75rem);line-height:1.17;letter-spacing:-.025em;margin:0 0 12px}.story:first-child h2{font-size:clamp(1.75rem,4vw,2.8rem)}.summary{color:var(--muted);margin:0 0 18px}.sources{display:flex;flex-wrap:wrap;gap:7px;margin-top:auto}.source{display:inline-block;text-decoration:none;border:1px solid var(--line);background:var(--bg);padding:6px 9px;border-radius:8px;font-size:.81rem}.source:hover{border-color:var(--blue)}.archive-wrap{margin-top:34px;padding-top:22px;border-top:1px solid var(--line)}.archive-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.archive-head h2{font-size:1.15rem;margin:0}.archive{display:flex;gap:8px;flex-wrap:wrap}.archive button{border:1px solid var(--line);background:var(--card);color:var(--text);padding:7px 10px;border-radius:8px;cursor:pointer}.archive button.active{border-color:var(--accent);color:var(--accent)}.empty{grid-column:span 12;border:1px dashed var(--line);border-radius:15px;padding:30px;text-align:center;color:var(--muted)}footer{margin-top:34px;color:var(--muted);font-size:.88rem}@media(max-width:720px){.hero{align-items:flex-start;flex-direction:column}.date{white-space:normal}.story,.story:first-child{grid-column:span 12}.top{margin-bottom:30px}}
  </style>
</head>
<body>
  <main class="shell">
    <nav class="top">
      <a class="brand" href="/">sarcasm.games</a>
      <div class="controls">
        <button class="control" id="languageButton" type="button">English</button>
        <button class="control" id="themeButton" type="button" aria-label="Bytt tema">◐</button>
      </div>
    </nav>

    <header class="hero">
      <h1 id="pageTitle">Gamingnytt</h1>
      <div class="date" id="editionDate">Laster …</div>
    </header>

    <div class="filters" id="filters" aria-label="Filtrer etter kategori"></div>
    <section class="grid" id="stories"><div class="empty">Laster saker …</div></section>

    <section class="archive-wrap">
      <div class="archive-head"><h2 id="archiveTitle">Arkiv</h2></div>
      <div class="archive" id="archive"></div>
    </section>

    <footer><a href="/" id="backLink">Tilbake til forsiden</a></footer>
  </main>

  <script>
    const LANGUAGE_KEY='quizLanguage';
    const I18N={
      no:{title:'Gamingnytt',archive:'Arkiv',back:'Tilbake til forsiden',read:'Kilde',confirmed:'Bekreftet',reported:'Rapportert',rumor:'Rykte',all:'Alle',filterLabel:'Filtrer etter kategori',empty:'Ingen saker er publisert.',noMatches:'Ingen saker i denne kategorien.',failed:'Kunne ikke laste nyhetene.'},
      en:{title:'Gaming news',archive:'Archive',back:'Back to the front page',read:'Source',confirmed:'Confirmed',reported:'Reported',rumor:'Rumour',all:'All',filterLabel:'Filter by category',empty:'No stories have been published.',noMatches:'No stories in this category.',failed:'The news could not be loaded.'}
    };
    let language=localStorage.getItem(LANGUAGE_KEY);if(!['no','en'].includes(language))language=/^(nb|nn|no)/i.test(navigator.language)?'no':'en';
    let edition=null;let archiveEntries=[];let activeCategory='all';
    const $=id=>document.getElementById(id);const value=v=>v?.[language]||v?.en||v?.no||'';
    function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
    function safeUrl(v){try{const url=new URL(v,location.origin);return ['http:','https:'].includes(url.protocol)?url.href:'#';}catch{return '#';}}
    function categoryKey(story){return String(story?.category?.en||story?.category?.no||'').trim().toLowerCase();}
    function categories(){const found=new Map();for(const story of edition?.stories||[]){const key=categoryKey(story);if(key&&!found.has(key))found.set(key,story.category);}return [...found.entries()];}
    function staticText(){const t=I18N[language];document.documentElement.lang=language;document.title=`${t.title} – sarcasm.games`;$('pageTitle').textContent=t.title;$('archiveTitle').textContent=t.archive;$('backLink').textContent=t.back;$('languageButton').textContent=language==='no'?'English':'Norsk';$('filters').setAttribute('aria-label',t.filterLabel);if(edition)render();}
    function sourceLinks(sources){const t=I18N[language];return (sources||[]).map(source=>`<a class="source" href="${esc(safeUrl(source.url))}" target="_blank" rel="noopener noreferrer">${esc(t.read)}: ${esc(source.name)} ↗</a>`).join('');}
    function renderFilters(){const t=I18N[language];const options=[['all',{no:t.all,en:t.all}],...categories()];$('filters').innerHTML=options.map(([key,label])=>`<button class="filter ${key===activeCategory?'active':''}" type="button" data-category="${esc(key)}" aria-pressed="${key===activeCategory}">${esc(key==='all'?t.all:value(label))}</button>`).join('');document.querySelectorAll('.filter').forEach(button=>button.addEventListener('click',()=>{activeCategory=button.dataset.category;render();}));}
    function renderStories(){const t=I18N[language];const allStories=edition.stories||[];const stories=activeCategory==='all'?allStories:allStories.filter(story=>categoryKey(story)===activeCategory);$('stories').innerHTML=stories.length?stories.map(story=>`<article class="story"><div class="meta"><span class="category">${esc(value(story.category))}</span><span class="status ${esc(story.status)}">${esc(t[story.status]||story.status)}</span></div><h2>${esc(value(story.title))}</h2><p class="summary">${esc(value(story.summary))}</p><div class="sources">${sourceLinks(story.sources)}</div></article>`).join(''):`<div class="empty">${esc(allStories.length?t.noMatches:t.empty)}</div>`;}
    function render(){const date=new Date(edition.generatedAt);$('editionDate').textContent=new Intl.DateTimeFormat(language==='no'?'nb-NO':'en-GB',{dateStyle:'long'}).format(date);if(activeCategory!=='all'&&!categories().some(([key])=>key===activeCategory))activeCategory='all';renderFilters();renderStories();renderArchive();}
    function renderArchive(){const t=I18N[language];$('archive').innerHTML=archiveEntries.length?archiveEntries.slice(0,14).map(entry=>`<button type="button" data-path="${esc(entry.path)}" class="${entry.date===edition?.date?'active':''}">${esc(entry.date)}</button>`).join(''):`<span>${esc(t.empty)}</span>`;document.querySelectorAll('#archive button').forEach(button=>button.addEventListener('click',()=>loadEdition(button.dataset.path)));}
    async function loadEdition(path='/news/data/latest.json'){try{const response=await fetch(`${path}?v=${Date.now()}`,{cache:'no-store'});if(!response.ok)throw new Error(response.status);edition=await response.json();activeCategory='all';render();}catch(error){console.error(error);$('editionDate').textContent='';$('filters').innerHTML='';$('stories').innerHTML=`<div class="empty">${esc(I18N[language].failed)}</div>`;}}
    async function loadArchive(){try{const response=await fetch(`/news/data/archive/index.json?v=${Date.now()}`,{cache:'no-store'});if(response.ok)archiveEntries=await response.json();}catch{}renderArchive();}
    $('languageButton').addEventListener('click',()=>{language=language==='no'?'en':'no';localStorage.setItem(LANGUAGE_KEY,language);staticText();});
    $('themeButton').addEventListener('click',()=>{document.body.classList.toggle('light');localStorage.setItem('theme',document.body.classList.contains('light')?'light':'dark');});
    if(localStorage.getItem('theme')==='light')document.body.classList.add('light');staticText();Promise.all([loadEdition(),loadArchive()]);
  </script>
</body>
</html>
